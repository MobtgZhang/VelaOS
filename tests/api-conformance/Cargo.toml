[package]
name = "vela-test-api-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "API behaviour conformance tests"

[dependencies]
vela-abi-native64.workspace = true
vela-hosted.workspace = true
vela-kernel-exec.workspace = true
vela-kernel-graphics.workspace = true
vela-kernel-intuition.workspace = true
vela-kernel-layers.workspace = true
vela-kernel-syscall.workspace = true
vela-kernel-vfs.workspace = true
vela-arch-common.workspace = true
vela-ramfs.workspace = true

[dev-dependencies]
# The SDK, for the libraries whose conformance is a property of the whole
# chain: IDL → jump table → stub → syscall → handler. Driving `utility.library`
# through `vela_sys::api` is the only way to assert that chain end to end;
# dispatching the syscall by hand would assert the handler and nothing about
# the table that reaches it.
vela-sys.workspace = true
