[workspace]
resolver = "2"
members = [
  # boot
  "boot/boot-protocol",
  "boot/elf-loader",
  "boot/uefi-loader",
  # hal
  "arch/common",
  "arch/x86_64",
  "arch/facade",
  "arch/aarch64",
  "arch/riscv64",
  "arch/loongarch64",
  # kernel
  "kernel/entry",
  "kernel/core",
  "kernel/console",
  "kernel/memory",
  "kernel/scheduler",
  "kernel/exec",
  "kernel/vfs",
  "kernel/dos",
  "kernel/syscall",
  "kernel/graphics",
  "kernel/layers",
  "kernel/intuition",
  "kernel/input",
  "kernel/dma",
  "kernel/net",
  "kernel/socket",
  "kernel/audio",
  "kernel/process",
  "kernel/gui",
  "kernel/boot_menu",
  # fs
  "fs/ramfs",
  "fs/amiga-path",
  "fs/fat",
  # userland
  "sdk/vela-sys",
  "userland/init",
  "userland/shell",
  "userland/workbench",
  "userland/apps/guitest",
  "userland/terminal",
  # drivers
  "drivers/nvme",
  "drivers/ata",
  "drivers/sata",
  "drivers/vga",
  "drivers/virtio-net",
  "kernel/drivers/graphics",
  "kernel/drivers/audio",
  "kernel/drivers/network",
  "kernel/drivers/storage",
  "kernel/drivers/usb",
  "kernel/drivers/gpu",
  # amiga abi + spec
  "amiga/abi-native64",
  "amiga/abi-guest32",
  "amiga/emu68k",
  # graphics
  "graphics/renderer2d",
  "graphics/icons",
  "graphics/font",
  "graphics/theme-classic",
  # fs
  "fs/ramfs",
  "fs/amiga-path",
  # userland
  "sdk/vela-sys",
  "userland/init",
  "userland/shell",
  "userland/workbench",
  "userland/apps/guitest",
  # tooling + tests
  "tools/xtask",
  "tools/fonttool",
  "platforms/hosted",
  "tests/abi-layout",
  "tests/api-conformance",
  "tests/boot-smoke",
  "tests/gui-golden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vela-boot-protocol = { path = "boot/boot-protocol" }
vela-elf-loader = { path = "boot/elf-loader" }
vela-arch-common = { path = "arch/common" }
vela-arch-x86_64 = { path = "arch/x86_64" }
vela-arch-aarch64 = { path = "arch/aarch64" }
vela-arch-riscv64 = { path = "arch/riscv64" }
vela-arch-loongarch64 = { path = "arch/loongarch64" }
vela-arch = { path = "arch/facade" }
vela-kernel-core = { path = "kernel/core" }
vela-kernel-memory = { path = "kernel/memory" }
vela-kernel-scheduler = { path = "kernel/scheduler" }
vela-kernel-exec = { path = "kernel/exec" }
vela-kernel-vfs = { path = "kernel/vfs" }
vela-kernel-dos = { path = "kernel/dos" }
vela-kernel-syscall = { path = "kernel/syscall" }
vela-kernel-graphics = { path = "kernel/graphics" }
vela-kernel-layers = { path = "kernel/layers" }
vela-kernel-intuition = { path = "kernel/intuition" }
vela-kernel-input = { path = "kernel/input" }
vela-kernel-console = { path = "kernel/console" }
vela-kernel-icon = { path = "kernel/icon" }
vela-kernel-workbench = { path = "kernel/workbench" }
vela-kernel-timer = { path = "kernel/timer" }
vela-kernel-device = { path = "kernel/device" }
vela-driver-nvme = { path = "drivers/nvme" }
vela-driver-ata = { path = "drivers/ata" }
vela-driver-sata = { path = "drivers/sata" }
vela-driver-vga = { path = "drivers/vga" }
vela-driver-virtio-net = { path = "drivers/virtio-net" }
vela-kernel-net = { path = "kernel/net" }
vela-kernel-socket = { path = "kernel/socket" }
vela-abi-native64 = { path = "amiga/abi-native64" }
vela-abi-guest32 = { path = "amiga/abi-guest32" }
vela-renderer2d = { path = "graphics/renderer2d" }
vela-icons = { path = "graphics/icons" }
vela-font = { path = "graphics/font" }
vela-theme-classic = { path = "graphics/theme-classic" }
vela-ramfs = { path = "fs/ramfs" }
vela-amiga-path = { path = "fs/amiga-path" }
vela-sys = { path = "sdk/vela-sys" }
vela-hosted = { path = "platforms/hosted" }
vela-shell = { path = "userland/shell" }
vela-workbench = { path = "userland/workbench" }
vela-kernel-process = { path = "kernel/process" }
vela-kernel-boot-menu = { path = "kernel/boot_menu" }
vela-driver-graphics = { path = "kernel/drivers/graphics" }
vela-driver-audio = { path = "kernel/drivers/audio" }
vela-driver-network = { path = "kernel/drivers/network" }
vela-driver-storage = { path = "kernel/drivers/storage" }
vela-driver-usb = { path = "kernel/drivers/usb" }
vela-driver-gpu = { path = "kernel/drivers/gpu" }

spin = { version = "0.9", default-features = false, features = ["once", "spin_mutex"] }
uefi = { version = "0.41", default-features = false }
log = { version = "0.4", default-features = false }

# Kernel images must abort on panic: unwinding needs unwinding tables and a
# personality routine that a no_std static binary cannot provide.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"