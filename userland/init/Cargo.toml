[package]
name = "vela-init"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VelaOS init: mount, bootstrap, start desktop"

[lib]
name = "vela_init"
path = "src/lib.rs"

[[bin]]
name = "init"
path = "src/main.rs"

[dependencies]
vela-sys.workspace = true

# The shell and the desktop are *linked* into `init` rather than spawned —
# there is no `RunSeg` in v0.1.0, and adding one for a single user would be a
# mechanism with exactly one user. The boot-menu choice selects which one.
# They are bare-metal-only dependencies: the hosted build never calls either,
# so declaring them here rather than unconditionally keeps them out of the
# host dependency set.
[target.'cfg(target_os = "none")'.dependencies]
vela-shell.workspace = true
vela-workbench.workspace = true

[dev-dependencies]
vela-hosted.workspace = true
