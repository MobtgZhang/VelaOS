[package]
name = "vela-kernel-entry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VelaOS kernel entry point and arch glue"

[features]
# Only the final kernel binary needs a panic handler; enabling it here pulls
# `vela-kernel-core`'s implementation in without making every library that
# depends on this crate a duplicate lang item.
default = []
panic-handler = ["vela-kernel-core/panic-handler"]

[[bin]]
name = "vela-kernel"
path = "src/main.rs"

[dependencies]
vela-boot-protocol.workspace = true
vela-arch-common.workspace = true
vela-arch.workspace = true
vela-kernel-console.workspace = true
vela-kernel-core.workspace = true
vela-kernel-dos.workspace = true
vela-kernel-exec.workspace = true
vela-kernel-graphics.workspace = true
vela-kernel-input.workspace = true
vela-kernel-icon.workspace = true
vela-kernel-intuition.workspace = true
vela-kernel-workbench.workspace = true
vela-kernel-layers.workspace = true
vela-kernel-syscall.workspace = true
vela-ramfs.workspace = true
vela-kernel-memory.workspace = true
vela-kernel-timer.workspace = true
vela-kernel-device.workspace = true
vela-driver-ata.workspace = true
vela-driver-nvme.workspace = true
vela-driver-sata.workspace = true
vela-driver-vga.workspace = true
vela-driver-virtio-net.workspace = true
vela-kernel-net.workspace = true
vela-kernel-socket.workspace = true
vela-kernel-process.workspace = true
vela-kernel-boot-menu.workspace = true
vela-driver-graphics.workspace = true
vela-driver-audio.workspace = true
vela-driver-network.workspace = true
vela-driver-storage.workspace = true
vela-driver-gpu.workspace = true
vela-driver-usb.workspace = true
spin.workspace = true